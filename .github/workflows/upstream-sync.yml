name: Upstream Sync

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: Upstream branch to sync from
        required: true
        default: main
        type: string
      target_branch:
        description: Fork branch to update via pull request
        required: true
        default: dev
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-sync-${{ github.event.inputs.target_branch || 'dev' }}
  cancel-in-progress: false

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    env:
      UPSTREAM_REPO: tapframe/NuvioTV
      DEFAULT_UPSTREAM_REF: main
      DEFAULT_TARGET_BRANCH: dev

    steps:
      - name: Resolve sync configuration
        shell: bash
        run: |
          upstream_ref="${{ github.event.inputs.upstream_ref }}"
          target_branch="${{ github.event.inputs.target_branch }}"

          if [ -z "$upstream_ref" ]; then
            upstream_ref="$DEFAULT_UPSTREAM_REF"
          fi
          if [ -z "$target_branch" ]; then
            target_branch="$DEFAULT_TARGET_BRANCH"
          fi

          sync_branch="sync/upstream-${upstream_ref}-to-${target_branch}"

          echo "UPSTREAM_REF=$upstream_ref" >> "$GITHUB_ENV"
          echo "TARGET_BRANCH=$target_branch" >> "$GITHUB_ENV"
          echo "SYNC_BRANCH=$sync_branch" >> "$GITHUB_ENV"

      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEFAULT_TARGET_BRANCH }}
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream and target history
        run: |
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch origin "$TARGET_BRANCH"
          git fetch upstream "$UPSTREAM_REF"

      - name: Merge upstream into sync branch
        id: merge
        shell: bash
        run: |
          git checkout -B "$SYNC_BRANCH" "origin/$TARGET_BRANCH"

          if ! git merge --no-ff --no-edit "upstream/$UPSTREAM_REF"; then
            git merge --abort || true
            echo "merge_conflict=true" >> "$GITHUB_OUTPUT"
            echo "### Upstream sync conflict" >> "$GITHUB_STEP_SUMMARY"
            echo "Automatic merge from upstream/$UPSTREAM_REF into $TARGET_BRANCH hit conflicts." >> "$GITHUB_STEP_SUMMARY"
            echo "Resolve the conflict locally, then push the updated branch." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if git diff --quiet "origin/$TARGET_BRANCH"...HEAD; then
            echo "no_changes=true" >> "$GITHUB_OUTPUT"
            echo "### Upstream sync" >> "$GITHUB_STEP_SUMMARY"
            echo "No upstream changes to merge from upstream/$UPSTREAM_REF into $TARGET_BRANCH." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

      - name: Push sync branch
        if: steps.merge.outputs.no_changes != 'true'
        run: |
          git push --force-with-lease origin "$SYNC_BRANCH"

      - name: Create or reuse sync pull request
        if: steps.merge.outputs.no_changes != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          existing_pr="$(gh pr list --head "$SYNC_BRANCH" --base "$TARGET_BRANCH" --state open --json number --jq '.[0].number')"

          if [ -n "$existing_pr" ] && [ "$existing_pr" != "null" ]; then
            echo "### Upstream sync" >> "$GITHUB_STEP_SUMMARY"
            echo "Updated existing PR #$existing_pr from $SYNC_BRANCH into $TARGET_BRANCH." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          gh pr create \
            --base "$TARGET_BRANCH" \
            --head "$SYNC_BRANCH" \
            --title "sync: merge upstream/$UPSTREAM_REF into $TARGET_BRANCH" \
            --body "Automated upstream sync PR from upstream/$UPSTREAM_REF into $TARGET_BRANCH. Merge after CI passes to keep Cockpit changes on top of upstream."

          echo "### Upstream sync" >> "$GITHUB_STEP_SUMMARY"
          echo "Created a new pull request from $SYNC_BRANCH into $TARGET_BRANCH." >> "$GITHUB_STEP_SUMMARY"