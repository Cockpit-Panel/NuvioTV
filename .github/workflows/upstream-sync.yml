name: Upstream Sync

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: Upstream branch to sync from
        required: true
        default: dev
        type: string
      target_branch:
        description: Fork branch to update automatically
        required: true
        default: dev
        type: string

permissions:
  contents: write

concurrency:
  group: upstream-sync-${{ github.event.inputs.target_branch || 'dev' }}
  cancel-in-progress: false

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    env:
      UPSTREAM_REPO: NuvioMedia/NuvioTV
      DEFAULT_UPSTREAM_REF: dev
      DEFAULT_TARGET_BRANCH: dev

    steps:
      - name: Resolve sync configuration
        shell: bash
        run: |
          upstream_ref="${{ github.event.inputs.upstream_ref }}"
          target_branch="${{ github.event.inputs.target_branch }}"

          if [ -z "$upstream_ref" ]; then
            upstream_ref="$DEFAULT_UPSTREAM_REF"
          fi
          if [ -z "$target_branch" ]; then
            target_branch="$DEFAULT_TARGET_BRANCH"
          fi

          echo "UPSTREAM_REF=$upstream_ref" >> "$GITHUB_ENV"
          echo "TARGET_BRANCH=$target_branch" >> "$GITHUB_ENV"

      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_branch || 'dev' }}
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream and target history
        run: |
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch origin "$TARGET_BRANCH"
          git fetch upstream "$UPSTREAM_REF"

      - name: Rebuild target from upstream and overlay Cockpit changes
        id: overlay
        shell: bash
        run: |
          git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
          old_head="$(git rev-parse HEAD)"
          old_base="$(git merge-base HEAD "upstream/$UPSTREAM_REF")"
          new_upstream="$(git rev-parse "upstream/$UPSTREAM_REF")"

          if [ "$old_base" = "$new_upstream" ]; then
            echo "no_changes=true" >> "$GITHUB_OUTPUT"
            echo "### Upstream sync" >> "$GITHUB_STEP_SUMMARY"
            echo "Already based on upstream/$UPSTREAM_REF at $new_upstream." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          overlay_patch="$RUNNER_TEMP/cockpit-overlay.patch"
          git diff --binary "$old_base..$old_head" > "$overlay_patch"
          test -s "$overlay_patch"

          git reset --hard "upstream/$UPSTREAM_REF"
          if ! git apply --3way --index "$overlay_patch"; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            if (( ${#conflicts[@]} == 0 )); then
              echo "Cockpit overlay failed without resolvable index conflicts." >&2
              exit 1
            fi

            # Overlay is authoritative for files where upstream and Cockpit touch
            # the same lines. Unrelated upstream files and non-conflicting hunks stay.
            git checkout --theirs -- "${conflicts[@]}"
            git add -- "${conflicts[@]}"
          fi

          if git diff --cached --quiet; then
            echo "Cockpit overlay produced no changes." >&2
            exit 1
          fi

          if git grep -n -E '^(<<<<<<<|=======|>>>>>>>)' -- . ':!*.md'; then
            echo "Conflict markers remain after applying the Cockpit overlay." >&2
            exit 1
          fi

          git commit -m "chore: sync upstream $UPSTREAM_REF and apply Cockpit overlay"
          echo "old_base=$old_base" >> "$GITHUB_OUTPUT"
          echo "new_upstream=$new_upstream" >> "$GITHUB_OUTPUT"
          echo "### Upstream sync" >> "$GITHUB_STEP_SUMMARY"
          echo "Rebuilt $TARGET_BRANCH from upstream/$UPSTREAM_REF at $new_upstream, then applied the Cockpit overlay from $old_head." >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Java
        if: steps.overlay.outputs.no_changes != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        if: steps.overlay.outputs.no_changes != 'true'
        uses: android-actions/setup-android@v3

      - name: Verify Cockpit config survived merge
        if: steps.overlay.outputs.no_changes != 'true'
        shell: bash
        run: |
          grep -q 'https://demo.cockpit.lol/api/nuvio/' app/build.gradle.kts
          grep -q '38208ec0916665e6989a1163bb362859' app/build.gradle.kts
          grep -q 'ce5722a7f71c099301473e10cc6a229754bc4ae71bb34fa143e056e1041e8a27' app/build.gradle.kts
          grep -q '3ad7e96c7376ea6b259c580336b49e220cf25074f7fbe636da70c3bb510f5bab' app/build.gradle.kts
          grep -q 'validateCockpitReleaseConfig' app/build.gradle.kts
          grep -q 'signInToPanel' app/src/main/java/com/nuvio/tv/ui/screens/account/AuthSignInScreen.kt
          grep -q 'PanelSessionDataStore' app/src/main/java/com/nuvio/tv/core/auth/AuthManager.kt
          ! grep -q 'auth_qr_continue_without_account' app/src/main/java/com/nuvio/tv/ui/screens/account/AuthSignInScreen.kt
          ./gradlew :app:validateCockpitReleaseConfig

      - name: Verify debug Kotlin compile
        if: steps.overlay.outputs.no_changes != 'true'
        run: ./gradlew :app:compileFullDebugKotlin

      - name: Verify full release assembles
        if: steps.overlay.outputs.no_changes != 'true'
        env:
          CI_USE_DEBUG_SIGNING: "true"
        run: ./gradlew :app:assembleFullRelease

      - name: Push updated target branch
        if: steps.overlay.outputs.no_changes != 'true'
        run: |
          git push --force-with-lease="refs/heads/$TARGET_BRANCH:$(git rev-parse "origin/$TARGET_BRANCH")" origin "HEAD:$TARGET_BRANCH"
