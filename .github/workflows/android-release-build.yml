name: Android Release Build

on:
  push:
    branches:
      - main
      - dev
    tags:
      - 'v*'
      - '*-beta*'
      - '*-rc*'
  pull_request:
    paths:
      - app/**
      - scripts/release_beta.py
      - gradle/**
      - build.gradle.kts
      - settings.gradle.kts
      - .github/workflows/android-release-build.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble-full-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare local properties
        env:
          LOCAL_PROPERTIES_BASE64: ${{ secrets.LOCAL_PROPERTIES_BASE64 }}
          LOCAL_DEV_PROPERTIES_BASE64: ${{ secrets.LOCAL_DEV_PROPERTIES_BASE64 }}
        run: |
          if [ -n "$LOCAL_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_PROPERTIES_BASE64" | base64 --decode > local.properties
          fi
          if [ -n "$LOCAL_DEV_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_DEV_PROPERTIES_BASE64" | base64 --decode > local.dev.properties
          fi

      - name: Prepare signing config
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.NUVIO_RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEY_ALIAS: ${{ secrets.NUVIO_RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.NUVIO_RELEASE_KEY_PASSWORD }}
          RELEASE_STORE_PASSWORD: ${{ secrets.NUVIO_RELEASE_STORE_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nuviotv.jks"
            {
              echo "NUVIO_RELEASE_STORE_FILE=$RUNNER_TEMP/nuviotv.jks"
              echo "NUVIO_RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS"
              echo "NUVIO_RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD"
              echo "NUVIO_RELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD"
            } >> "$GITHUB_ENV"
          else
            echo "CI_USE_DEBUG_SIGNING=true" >> "$GITHUB_ENV"
          fi

      - name: Build full release APKs
        run: ./gradlew :app:assembleFullRelease

      - name: Prepare release APK
        shell: bash
        run: |
          version_name="$(grep -m1 'versionName = ' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')"
          release_apk="app/build/outputs/apk/full/release/Nuvio_${version_name}.apk"
          build_tools_dir="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          zipalign_bin="$build_tools_dir/zipalign"
          apksigner_bin="$build_tools_dir/apksigner"

          cp app/build/outputs/apk/full/release/app-full-universal-release.apk "$release_apk"
          echo "RELEASE_APK=$release_apk" >> "$GITHUB_ENV"

          "$zipalign_bin" -c -v 4 "$release_apk"
          "$apksigner_bin" verify --verbose "$release_apk"

      - name: Upload release APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: full-release-apks
          path: |
            ${{ env.RELEASE_APK }}
            app/build/outputs/apk/full/release/app-full-universal-release.apk
            app/build/outputs/apk/full/release/app-full-arm64-v8a-release.apk
            app/build/outputs/apk/full/release/app-full-armeabi-v7a-release.apk
            app/build/outputs/apk/full/release/output-metadata.json
            app/build/outputs/mapping/fullRelease/mapping.txt

      - name: Publish GitHub release for tag
        if: ${{ github.ref_type == 'tag' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          prerelease_args=()
          case "$RELEASE_TAG" in
            *-beta*|*-rc*) prerelease_args+=(--prerelease) ;;
          esac

          release_assets=(
            "$RELEASE_APK"
            app/build/outputs/apk/full/release/app-full-arm64-v8a-release.apk
            app/build/outputs/apk/full/release/app-full-armeabi-v7a-release.apk
          )

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TAG" "${prerelease_args[@]}"
            gh release upload "$RELEASE_TAG" "${release_assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" \
              "${release_assets[@]}" \
              --title "$RELEASE_TAG" \
              --generate-notes \
              "${prerelease_args[@]}"
          fi
